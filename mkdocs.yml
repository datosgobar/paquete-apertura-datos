site_name: Paquete de Apertura de Datos de la República Argentina
site_url: https://datosgobar.github.io/paquete-apertura-datos
site_description: Recursos para la apertura de datos públicos nacionales y sub-nacionales en Argentina.
site_author: Datos Argentina
repo_url: https://github.com/datosgobar/paquete-apertura-datos/

nav:
  - Inicio: index.md
  - Material introductorio: https://www.argentina.gob.ar/sites/default/files/datos_-_brochure_datos_abiertos.pdf
  - Guías de buenas prácticas:
    - Guía para la publicación de datos en formatos abiertos: guia-abiertos.md
    - Guía para la identificación y uso de entidades interoperables: guia-interoperables.md
    - Guía para el uso y la publicación de metadatos: guia-metadatos.md
    - Datasets sugeridos: datasets-sugeridos.md
  - Guías de implementación:
    - Guía para la apertura de datos en organismos de la Administración Pública Nacional: guia-apn.md
    - Guía para la apertura de datos en gobiernos provinciales y locales: guia-subnacionales.md
  - Marco legal:
    - Decreto 117/2016 "Plan de Apertura de Datos": decreto-117-2016.md
    - Ley 27275 "Derecho de Acceso a la Información Pública": ley-27275-2016.md
    # - Resolución xx/2019 "Política de Apertura de Datos": resolucion-xx-2019.md
    - Perfil de Aplicación Nacional de Metadatos para Datos Abiertos: perfil-metadatos.md
  - Herramientas: herramientas.md
  - Glosario: glosario.md

docs_dir: docs
plugins:
  - search
  # URLs legacy con guion bajo -> guion medio. Reemplaza el `cp -rf` que
  # duplicaba el sitio entero en el Makefile.
  - redirects:
      redirect_maps:
        guia_abiertos.md: guia-abiertos.md
        guia_interoperables.md: guia-interoperables.md
        guia_metadatos.md: guia-metadatos.md
        guia_apn.md: guia-apn.md
        guia_subnacionales.md: guia-subnacionales.md
        perfil_metadatos.md: perfil-metadatos.md
        datasets-especificaciones.md: datasets-sugeridos.md
        datasets-especificaciones/calidad-agua.md: datasets-sugeridos/calidad-agua.md
        datasets-especificaciones/calidad-aire.md: datasets-sugeridos/calidad-aire.md
        datasets-especificaciones/contrataciones-publicas.md: datasets-sugeridos/contrataciones-publicas.md
        datasets-especificaciones/crimen.md: datasets-sugeridos/crimen.md
        datasets-especificaciones/declaraciones-juradas.md: datasets-sugeridos/declaraciones-juradas.md
        datasets-especificaciones/denuncias.md: datasets-sugeridos/denuncias.md
        datasets-especificaciones/elecciones.md: datasets-sugeridos/elecciones.md
        datasets-especificaciones/nomina-funcionarios.md: datasets-sugeridos/nomina-funcionarios.md
        datasets-especificaciones/normativa.md: datasets-sugeridos/normativa.md
        datasets-especificaciones/organigrama.md: datasets-sugeridos/organigrama.md
        datasets-especificaciones/permisos.md: datasets-sugeridos/permisos.md
        datasets-especificaciones/presupuesto-ingresos.md: datasets-sugeridos/presupuesto-ingresos.md
        datasets-especificaciones/presupuesto.md: datasets-sugeridos/presupuesto.md
        datasets-especificaciones/registro-proveedores.md: datasets-sugeridos/registro-proveedores.md
        datasets-especificaciones/salud.md: datasets-sugeridos/salud.md
        datasets-especificaciones/servicios.md: datasets-sugeridos/servicios.md
        datasets-especificaciones/template.md: datasets-sugeridos/template.md
        datasets-especificaciones/tramites.md: datasets-sugeridos/tramites.md

theme:
  name: material
  logo: assets/images/Logo_Datos.svg
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Modo claro

# # extensiones recomendadas con este theme
markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - markdown.extensions.toc:
      anchorlink: true
      permalink: '&#128279;'
  - fenced_code
  - codehilite
  - admonition

extra:
  analytics:
    provider: google
    property: G-WFY4MZM8FP
