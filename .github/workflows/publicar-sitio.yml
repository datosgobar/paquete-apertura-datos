# Publica el sitio en la rama gh-pages. Reemplaza el `make build` manual que
# commiteaba el HTML generado dentro de docs/.
#
# Requiere, una sola vez: Settings -> Pages -> Source = rama `gh-pages`.
name: Publicar sitio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
